name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a signed GitHub release (v3_openjdk only, requires ZYROX_KEYSTORE_* secrets)"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag to publish (e.g. v2.8.0)"
        required: false
        default: "v2.8.0"
        type: string

# Default least-privilege token across all jobs; only publish-release escalates to contents:write.
permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-sast:
    name: Security & Supply-Chain Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Security, Manifest & Supply-Chain Policy Audit (MobSF + Static Guardrails)
        run: |
          python3 -m pip install --quiet --upgrade pip mobsfscan
          mobsfscan app_mojo/src/main --json -o /tmp/mobsf-report.json || true
          python3 - <<'PY'
          import json, os, re, sys, xml.etree.ElementTree as ET

          failures = []

          # 1. MobSF static analysis assertions
          with open("/tmp/mobsf-report.json") as f:
              report = json.load(f)
          results = report.get("results", {})
          blocked_rules = {
              "android_zip_slip",
              "android_manifest_allow_backup",
              "android_manifest_base_config_cleartext",
              "android_manifest_domain_config_cleartext",
              "android_task_hijacking1",
              "android_task_hijacking2",
              "java_insecure_random",
          }
          for rule, info in results.items():
              sev = info.get("metadata", {}).get("severity", "")
              if sev == "ERROR" or rule in blocked_rules or rule.startswith("webview_"):
                  failures.append(f"MobSF [{sev}] {rule}: {len(info.get('files', []))} hit(s)")

          # 2. Zero committed signing keys or private material anywhere in repository
          for root, dirs, files in os.walk("."):
              if ".git" in dirs:
                  dirs.remove(".git")
              for fn in files:
                  if fn.endswith((".keystore", ".jks", ".p12", ".pfx", ".key")) or fn == "curseforge_key.txt":
                      failures.append(f"Committed secret/key file found: {os.path.join(root, fn)}")

          # 3. Workflow self-audit: never auto-generate ephemeral random release keys or expose signing to PRs
          wf = open(".github/workflows/android.yml").read()
          for bad_wf, desc in (
              ("-gen" + "keypair", "ephemeral CI keystore generation"),
              ("pull_request" + "_target", "unsafe PR target trigger"),
          ):
              if bad_wf in wf:
                  failures.append(f"Workflow supply-chain violation ({desc}): {bad_wf}")

          # 4. AndroidManifest hardening & explicit exported declarations
          ns = "{http://schemas.android.com/apk/res/android}"
          manifest = ET.parse("app_mojo/src/main/AndroidManifest.xml").getroot()
          app = manifest.find("application")
          if app.get(ns + "allowBackup") != "false":
              failures.append("AndroidManifest application allowBackup must be false")
          if app.get(ns + "usesCleartextTraffic") != "false":
              failures.append("AndroidManifest application usesCleartextTraffic must be false")
          if app.get(ns + "debuggable") == "true":
              failures.append("AndroidManifest application must not set debuggable=true")
          for tag in ("activity", "service", "receiver", "provider"):
              for comp in app.findall(tag):
                  if comp.get(ns + "exported") is None:
                      failures.append(f"Missing explicit android:exported on <{tag} {comp.get(ns + 'name')}>")

          # 5. Network security config must forbid cleartext globally
          netcfg = open("app_mojo/src/main/res/xml/netconfig.xml").read()
          if 'cleartextTrafficPermitted="true"' in netcfg or 'cleartextTrafficPermitted="false"' not in netcfg:
              failures.append("netconfig.xml must enforce cleartextTrafficPermitted=\"false\"")

          # 6. Anti-PHA, credential-leak & UI regression guardrails
          banned = [
              ("obfuscated_hash", r"\bREQW_HASH\b"),
              ("deadlock_trap", r"\bwaitOnObj\b"),
              ("package_collision", r"git\.artdeell\.mjlaunch"),
              ("removed_updates_card", r"\bzyrox_updates_card\b"),
              ("removed_loading_warning", r"\bloading_screen_warning\b|If you are stuck here"),
              ("stale_wiki_domain", r"mojolauncher\.ru"),
              ("raw_launchargs_log", r'Log\.[idwev]\(\s*"GameRunner"\s*,\s*"Running with "\s*\+\s*launchArgs\.toString\(\)'),
              ("token_log", r"Log\.[idwev]\([^;]*(authCode|Xbl Token|Xbl Xsts|MC token|access_token|refresh_token)"),
          ]
          for root, _, files in os.walk("app_mojo/src/main"):
              for fn in files:
                  if not fn.endswith((".java", ".xml", ".c", ".h")):
                      continue
                  path = os.path.join(root, fn)
                  content = open(path, errors="ignore").read()
                  for name, pattern in banned:
                      if re.search(pattern, content):
                          failures.append(f"Forbidden pattern [{name}] in {path}")

          # 7. Wiring guards for invariants that are behavior-tested via pure helpers
          #    (LaunchOnboardingAndDefaultFabricTest); these ensure the helpers stay wired in.
          wiring = [
              ("app_mojo/src/main/java/git/artdeell/mojo/game/GameActivity.java", r"launcherGLView\.start\(localBinder\.claimConnection\(\)\)", True),
              ("app_mojo/src/main/java/git/artdeell/mojo/services/GameService.java", r"mLocalBinder\.isActive\s*=\s*true", False),
              ("app_mojo/src/main/java/git/artdeell/mojo/LauncherActivity.java", r"OnboardingWizardFragment\.resolveAuthRoute\(", True),
              ("app_mojo/src/main/java/com/kdt/mcgui/AccountSpinner.java", r"shouldCreateAccountFromSelection\(", True),
              ("app_mojo/src/main/java/git/artdeell/mojo/fragments/MainMenuFragment.java", r"ProgressKeeper\.waitUntilDone", True),
              ("app_mojo/src/main/java/git/artdeell/mojo/instances/Instances.java", r"internalCreateInstance\(\s*Instances::applyFirstTimeDefaults", True),
          ]
          for path, pattern, required in wiring:
              found = re.search(pattern, open(path, errors="ignore").read()) is not None
              if found != required:
                  failures.append(f"Wiring guard {'missing' if required else 'forbidden'} /{pattern}/ in {path}")

          if failures:
              for item in failures[:15]:
                  print(f"::error title=SecurityGateFailure::{item}")
              sys.exit(1)
          print("::notice title=SecurityGatePassed::MobSF SAST, manifest, netconfig, supply-chain & redaction checks passed (0 violations).")
          PY

  build-test-verify:
    name: Test, Lint & Unsigned Build
    needs: [security-sast]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # Strictly zero production signing credentials exposed to PR or branch verification builds.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Get LTW
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_mojo/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.3
          name: mesa-aar
          path: app_mojo/libs

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.5"

      - name: Run Automated JUnit Test Suite
        run: |
          set -o pipefail
          if ! gradle :app_mojo:testFullReleaseUnitTest --stacktrace 2>&1 | tee /tmp/gradle-test.log; then
            python3 - <<'PY'
          lines = open("/tmp/gradle-test.log", errors="ignore").read().splitlines()
          err = [l for l in lines if ("error:" in l or "FAILED" in l or "Exception" in l or "Caused by:" in l or "AssertionError" in l or "at git.artdeell" in l)]
          snippet = " || ".join((err[-30:] if err else lines[-30:]))[:3500]
          print(f"::error title=UnitTestFailure::{snippet}")
          PY
            exit 1
          fi
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failed = errors = 0
          suites = []
          for xf in sorted(glob.glob("app_mojo/build/test-results/testFullReleaseUnitTest/TEST-*.xml")):
              r = ET.parse(xf).getroot()
              t = int(r.get("tests", 0)); f = int(r.get("failures", 0)); e = int(r.get("errors", 0))
              total += t; failed += f; errors += e
              suites.append(f"{r.get('name').split('.')[-1]}({t})")
          print(f"::notice title=UnitTestsPassed::{total} tests passed, {failed} failures, {errors} errors across {', '.join(suites)}")
          PY

      - name: Unit-test coverage report (JaCoCo, non-blocking)
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app_mojo:jacocoUnitTestReport 2>&1 | tail -n 15
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          xf = "app_mojo/build/reports/jacoco/jacocoUnitTestReport/jacocoUnitTestReport.xml"
          if not os.path.isfile(xf):
              print("::warning title=Coverage::JaCoCo XML report not produced")
              raise SystemExit(0)
          root = ET.parse(xf).getroot()
          totals = {c.get("type"): c for c in root.findall("counter")}
          def pct(kind):
              c = totals.get(kind)
              if c is None: return "n/a"
              cov, miss = int(c.get("covered")), int(c.get("missed"))
              return f"{100.0 * cov / max(1, cov + miss):.1f}% ({cov}/{cov + miss})"
          pkgs = []
          for p in root.findall("package"):
              line = next((c for c in p.findall("counter") if c.get("type") == "LINE"), None)
              if line is not None:
                  cov, miss = int(line.get("covered")), int(line.get("missed"))
                  if cov + miss >= 200:
                      pkgs.append((100.0 * cov / (cov + miss), p.get("name").replace("/", ".")))
          worst = ", ".join(f"{n.split('.')[-1]} {v:.0f}%" for v, n in sorted(pkgs)[:6])
          print(f"::notice title=UnitTestCoverage::lines {pct('LINE')}, branches {pct('BRANCH')}; least-covered packages: {worst}")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as fh:
                  fh.write(f"### Unit-test coverage\n\n| Metric | Coverage |\n|---|---|\n| Lines | {pct('LINE')} |\n| Branches | {pct('BRANCH')} |\n| Methods | {pct('METHOD')} |\n\nLeast-covered packages: {worst}\n")
          PY

      - name: Upload coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-coverage
          path: app_mojo/build/reports/jacoco/jacocoUnitTestReport/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Android Lint Static Verification
        run: |
          set -o pipefail
          # -Dlint.baselines.continue=true: if app_mojo/lint-baseline.xml is not committed yet, lint
          # creates it and continues instead of aborting; once committed, only NEW issues fail.
          if ! gradle :app_mojo:lintFullRelease -Dlint.baselines.continue=true 2>&1 | tee /tmp/gradle-lint.log; then
            TAIL="$(grep -E 'error:|Error:|FAILED|Exception|Caused by:' /tmp/gradle-lint.log | tail -n 25 | tr '\n' ' ' | cut -c1-3200)"
            echo "::error title=LintFailure::${TAIL:-$(tail -n 20 /tmp/gradle-lint.log | tr '\n' ' ')}"
            exit 1
          fi
          echo "::notice title=AndroidLintPassed::lintFullRelease completed cleanly."

      - name: Build & Verify Unsigned Release APK
        run: |
          set -o pipefail
          mkdir -p out
          if ! gradle :app_mojo:assembleFullRelease 2>&1 | tee /tmp/gradle-apk.log; then
            TAIL="$(grep -E 'error:|FAILED|Exception|Caused by:' /tmp/gradle-apk.log | tail -n 30 | tr '\n' ' ' | cut -c1-3500)"
            echo "::error title=ApkBuildFailure::${TAIL:-$(tail -n 20 /tmp/gradle-apk.log | tr '\n' ' ')}"
            exit 1
          fi
          APK_SRC="app_mojo/build/outputs/apk/full/release/app_mojo-full-arm64-v8a-release-unsigned.apk"
          if [ ! -f "$APK_SRC" ]; then
            APK_SRC="app_mojo/build/outputs/apk/full/release/app_mojo-full-release-unsigned.apk"
          fi
          cp "$APK_SRC" out/ZyroxLauncher-unsigned-release.apk
          python3 - <<'PY'
          import glob, hashlib, os, re, subprocess, sys

          def fail(msg):
              print(f"::error title=UnsignedVerifyFailure::{msg}")
              sys.exit(1)

          android_home = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT")
          def ver_key(p):
              return [int(x) if x.isdigit() else x for x in re.split(r"[.-]", os.path.basename(p))]
          bt = sorted(glob.glob(os.path.join(android_home, "build-tools", "*")), key=ver_key)[-1]
          aapt2 = os.path.join(bt, "aapt2")
          apk = "out/ZyroxLauncher-unsigned-release.apk"
          if not os.path.isfile(apk):
              fail(f"Missing unsigned APK: {apk}")
          size_mb = os.path.getsize(apk) / (1024 * 1024)
          badging_proc = subprocess.run([aapt2, "dump", "badging", apk], capture_output=True, text=True)
          if badging_proc.returncode != 0:
              fail(f"aapt2 dump badging failed: {badging_proc.stderr[:400]}")
          badging = badging_proc.stdout
          pkg_line = badging.splitlines()[0] if badging else "empty"
          for expected in ("package: name='com.zyrox.launcher'", "versionName='2.8.0'", "targetSdkVersion:'36'", "'arm64-v8a'"):
              if expected not in badging:
                  fail(f"Missing {expected} in badging ({pkg_line})")
          if "application-debuggable" in badging:
              fail("APK has android:debuggable=true!")
          if "application-testOnly" in badging:
              fail("APK has android:testOnly=true!")
          # Verify Android 15/16 16 KB ELF page alignment & uncompressed MP4 streaming assets
          import zipfile, struct
          with zipfile.ZipFile(apk, "r") as zf:
              elf_checked = 0
              mp4_stored = 0
              for zi in zf.infolist():
                  if zi.filename in ("lib/arm64-v8a/libmojoexec.so", "lib/x86_64/libmojoexec.so"):
                      elf = zf.read(zi.filename)
                      e_phoff = struct.unpack_from("<Q", elf, 32)[0]
                      e_phentsize, e_phnum = struct.unpack_from("<HH", elf, 54)
                      for idx in range(e_phnum):
                          off = e_phoff + idx * e_phentsize
                          p_type = struct.unpack_from("<I", elf, off)[0]
                          if p_type == 1:  # PT_LOAD
                              p_align = struct.unpack_from("<Q", elf, off + 48)[0]
                              if p_align < 16384:
                                  fail(f"{zi.filename} PT_LOAD align={p_align} (< 16384)")
                      elf_checked += 1
                  elif zi.filename.endswith(".mp4") and zi.filename.startswith("res/"):
                      if zi.compress_type != zipfile.ZIP_STORED:
                          fail(f"{zi.filename} is compressed (type={zi.compress_type}); must be ZIP_STORED for openRawResourceFd")
                      mp4_stored += 1
              if elf_checked == 0:
                  fail("lib/arm64-v8a/libmojoexec.so missing from arm64-v8a APK")
              if mp4_stored < 2:
                  fail(f"Expected 2 bundled ZIP_STORED MP4 backdrops in res/raw, found {mp4_stored}")
          h = hashlib.sha256()
          with open(apk, "rb") as fh:
              for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                  h.update(chunk)
          sha = h.hexdigest()
          print(f"::notice title=UnsignedApkVerified::pkg=com.zyrox.launcher ver=2.8.0 abi=arm64-v8a targetSdk=36 debuggable=false mp4_stored={mp4_stored} size={size_mb:.1f}MB sha256={sha}")
          PY

      - name: Upload Unsigned Release CI Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ZyroxLauncher-unsigned-ci-apk
          path: out/ZyroxLauncher-unsigned-release.apk
          retention-days: 14

  sign-release:
    name: Trusted Production Signing & Verification
    needs: [build-test-verify]
    # Restricted strictly to non-PR runs on the protected default branch or official v* release tags.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/v3_openjdk' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.sign_apk.outputs.signed }}
    steps:
      - name: Check Production Signing Secrets Availability
        id: check_secrets
        env:
          SECRET_KS_B64: ${{ secrets.ZYROX_KEYSTORE_BASE64 }}
          SECRET_KS_PASS: ${{ secrets.ZYROX_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ZYROX_KEY_ALIAS }}
        run: |
          if [ -n "$SECRET_KS_B64" ] && [ -n "$SECRET_KS_PASS" ] && [ -n "$SECRET_KEY_ALIAS" ]; then
            echo "mode=secret" >> "$GITHUB_OUTPUT"
          else
            echo "mode=continuity" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore Legacy Publisher Key for Upgrade Continuity (Read-Only)
        id: restore_continuity
        if: steps.check_secrets.outputs.mode == 'continuity'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.zyrox-signing
          key: zyrox-release-signing-rsa4096-v1

      - name: Download Verified Unsigned Release APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ZyroxLauncher-unsigned-ci-apk
          path: unsigned-in

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Align & Sign Production Release APK (v1 + v2 + v3)
        id: sign_apk
        env:
          SIGN_MODE: ${{ steps.check_secrets.outputs.mode }}
          SECRET_KS_B64: ${{ secrets.ZYROX_KEYSTORE_BASE64 }}
          SECRET_KS_PASS: ${{ secrets.ZYROX_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ZYROX_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.ZYROX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p out
          KS_FILE="$RUNNER_TEMP/zyrox-release-ephemeral.keystore"

          if [ "$SIGN_MODE" = "secret" ]; then
            printf '%s' "$SECRET_KS_B64" | tr -d ' \n\r\t' | base64 -d > "$KS_FILE"
            chmod 600 "$KS_FILE"
            KS_PASS="$SECRET_KS_PASS"
            KEY_PASS="${SECRET_KEY_PASS:-$SECRET_KS_PASS}"
            KEY_ALIAS="$SECRET_KEY_ALIAS"
          elif [ -f "$HOME/.zyrox-signing/zyrox-release.p12" ] && [ -f "$HOME/.zyrox-signing/zyrox-release.pass" ]; then
            cp "$HOME/.zyrox-signing/zyrox-release.p12" "$KS_FILE"
            chmod 600 "$KS_FILE"
            KS_PASS="$(cat "$HOME/.zyrox-signing/zyrox-release.pass")"
            echo "::add-mask::$KS_PASS"
            KEY_PASS="$KS_PASS"
            KEY_ALIAS="zyrox_release"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=SigningSkippedNoSecrets::Production signing skipped because ZYROX_KEYSTORE_* repository secrets are not configured and no continuity publisher key was found. No random keystore is ever generated."
            exit 0
          fi

          ANDROID_SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT_DIR="$(ls -d "$ANDROID_SDK"/build-tools/* | sort -V | tail -n 1)"
          ALIGNED_APK="$RUNNER_TEMP/ZyroxLauncher-aligned.apk"

          "$BT_DIR/zipalign" -f -p 4 unsigned-in/ZyroxLauncher-unsigned-release.apk "$ALIGNED_APK"
          KS_PASS_ENV="$KS_PASS" KEY_PASS_ENV="$KEY_PASS" "$BT_DIR/apksigner" sign \
            --ks "$KS_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS_ENV \
            --key-pass env:KEY_PASS_ENV \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out out/Zyrox.Launcher.apk \
            "$ALIGNED_APK"

          rm -f "$ALIGNED_APK"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Purge Ephemeral Signing Keystore
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/zyrox-release-ephemeral.keystore" "$RUNNER_TEMP/ZyroxLauncher-aligned.apk" "$HOME/.zyrox-signing"

      - name: Verify zipalign, APK Signature v1/v2/v3, Certificate Fingerprint & SHA-256
        if: steps.sign_apk.outputs.signed == 'true'
        env:
          SIGN_MODE: ${{ steps.check_secrets.outputs.mode }}
        run: |
          python3 - <<'PY'
          import glob, hashlib, os, re, subprocess, sys

          def fail(msg):
              print(f"::error title=ReleaseSignatureFailure::{msg}")
              sys.exit(1)

          android_home = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT")
          def ver_key(p):
              return [int(x) if x.isdigit() else x for x in re.split(r"[.-]", os.path.basename(p))]
          bt = sorted(glob.glob(os.path.join(android_home, "build-tools", "*")), key=ver_key)[-1]
          zipalign = os.path.join(bt, "zipalign")
          apksigner = os.path.join(bt, "apksigner")
          aapt2 = os.path.join(bt, "aapt2")

          apk = "out/Zyrox.Launcher.apk"
          if subprocess.run([zipalign, "-c", "4", apk], capture_output=True).returncode != 0:
              fail("zipalign verification failed")

          sig = subprocess.run([apksigner, "verify", "--verbose", "--print-certs", apk], capture_output=True, text=True)
          if sig.returncode != 0:
              fail(f"apksigner verification failed: {sig.stdout} {sig.stderr}")
          s_out = sig.stdout
          for req in (
              "Verified using v1 scheme (JAR signing): true",
              "Verified using v2 scheme (APK Signature Scheme v2): true",
              "Verified using v3 scheme (APK Signature Scheme v3): true",
          ):
              if req not in s_out:
                  fail(f"Missing required signature scheme: {req}")
          if "android debug" in s_out.lower():
              fail("Refusing Android Debug certificate for release artifact")

          cert_sha256 = ""
          cert_dn = ""
          for line in s_out.splitlines():
              low = line.lower()
              if "certificate dn:" in low and not cert_dn:
                  cert_dn = line[low.index("certificate dn:") + len("certificate dn:"):].strip()
              elif "certificate sha-256 digest:" in low and not cert_sha256:
                  m = re.search(r"([0-9a-fA-F]{64})", line)
                  if m:
                      cert_sha256 = m.group(1).lower()

          expected_continuity = "66b2f822eceeea52bf0bcffde0d5f9be362de30495232aae7ef15e9e8ce6c5af"
          if os.environ.get("SIGN_MODE") == "continuity" and cert_sha256 != expected_continuity:
              fail(f"Continuity certificate SHA-256 mismatch: expected {expected_continuity}, got {cert_sha256}")

          badging = subprocess.run([aapt2, "dump", "badging", apk], capture_output=True, text=True, check=True).stdout
          for expected in ("package: name='com.zyrox.launcher'", "versionName='2.8.0'", "targetSdkVersion:'36'"):
              if expected not in badging:
                  fail(f"Missing {expected} in signed APK badging")
          if "application-debuggable" in badging or "application-testOnly" in badging:
              fail("Signed APK must not be debuggable or testOnly")

          h = hashlib.sha256()
          with open(apk, "rb") as fh:
              for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                  h.update(chunk)
          apk_sha = h.hexdigest()

          with open("out/SIGNING_CERTIFICATE_SHA256.txt", "w") as cf:
              cf.write("Package: com.zyrox.launcher\n")
              cf.write("Version: 2.8.0 (arm64-v8a)\n")
              cf.write("Signature Schemes: v1 + v2 + v3 (RSA-4096)\n")
              cf.write(f"Certificate DN: {cert_dn}\n")
              cf.write(f"Certificate SHA-256: {cert_sha256}\n")
              cf.write(f"APK SHA-256: {apk_sha}\n")

          size_mb = os.path.getsize(apk) / (1024 * 1024)
          print(f"::notice title=SignedReleaseVerified::pkg=com.zyrox.launcher ver=2.8.0 abi=arm64-v8a sig=v1+v2+v3 size={size_mb:.1f}MB sha256={apk_sha} cert_sha256={cert_sha256}")
          PY

      - name: Upload Verified Signed Release Bundle
        if: steps.sign_apk.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ZyroxLauncher-signed-release
          path: |
            out/Zyrox.Launcher.apk
            out/SIGNING_CERTIFICATE_SHA256.txt
          retention-days: 30

  publish-release:
    name: Publish Authorized GitHub Release
    needs: [sign-release]
    # Only publishes when explicitly triggered by a v* release tag or manual publish_release=true dispatch.
    if: >-
      needs.sign-release.outputs.signed == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/v3_openjdk' &&
        (inputs.publish_release == true || github.event.inputs.publish_release == 'true')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download Verified Signed Release Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ZyroxLauncher-signed-release
          path: out

      - name: Publish Signed GitHub Release (APK + Source Archives Only)
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${INPUT_TAG:-v2.8.0}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error title=InvalidReleaseTag::Refusing invalid tag format: $TAG"
            exit 1
          fi
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            echo "## Zyrox Launcher ${TAG} — Download Integrity, Token Vault & Reliability Hardening"
            echo ""
            echo "### What's New in 2.8.0"
            echo "- **Rapid Start integrity fix:** Cached game libraries are no longer trusted by file size alone. Fast startup now skips re-hashing only for files that previously passed SHA-1 verification and are unchanged on disk; anything modified is re-verified and re-downloaded."
            echo "- **Fail-closed account token vault:** If Android Keystore encryption fails, the launcher regenerates its key once and otherwise asks you to sign in again; it never writes tokens in plaintext (Android 6.0+)."
            echo "- **More reliable downloads:** Strictly bounded retries with accurate progress, automatic recovery from truncated files and servers that ignore resume requests, faster completion detection, and protection against two installs writing the same file at once."
            echo "- **Safer 1-Tap crash fixes:** Crash analysis no longer guesses mod names from ordinary log text, refuses to disable a mod when several match, never touches core/library jars, and never overwrites a previously disabled copy."
            echo "- **Under the hood:** Lint now gates CI, deprecated storage APIs are isolated, internal event listeners are de-duplicated, and 36 new unit tests cover the vault, file verification, download queue, crash auto-fix and event bus."
            echo ""
            echo "### Download & Upgrade"
            echo "Download and install **[Zyrox Launcher.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Zyrox.Launcher.apk)** directly (signed with the persistent RSA-4096 \`v1 + v2 + v3\` publisher key for seamless in-place upgrade over \`v2.7.x\` / \`v2.6.x\` / \`v2.5.x\` / \`v2.4.x\` / \`v2.3.x\` / \`v2.2.x\` / \`v2.1.x\` / \`v2.0.x\` / \`v1.0.x\` — all instances, worlds, mods, servers & controls remain untouched)."
            echo ""
            echo "### Signing & SHA-256 Verification"
            echo '```'
            cat out/SIGNING_CERTIFICATE_SHA256.txt
            echo '```'
          } > "$NOTES_FILE"

          ls -lh out/Zyrox.Launcher.apk
          # Attach strictly ONLY the signed APK so the Release Assets list contains ONLY:
          #   1. Zyrox.Launcher.apk (Zyrox Launcher.apk)
          #   2. Source code (zip)   [GitHub built-in]
          #   3. Source code (tar.gz) [GitHub built-in]
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for extra in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name | select(. != "Zyrox.Launcher.apk")'); do
              gh release delete-asset "$TAG" "$extra" --yes --repo "$GITHUB_REPOSITORY" || true
            done
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null 2>&1 || true
            gh release upload "$TAG" \
              "out/Zyrox.Launcher.apk#Zyrox Launcher.apk" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --title "Zyrox Launcher ${TAG}" \
              --notes-file "$NOTES_FILE" \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              "out/Zyrox.Launcher.apk#Zyrox Launcher.apk" \
              --target "$GITHUB_SHA" \
              --title "Zyrox Launcher ${TAG}" \
              --notes-file "$NOTES_FILE" \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi
          echo "::notice title=ReleasePublished::Published Zyrox Launcher ${TAG} (APK + Source zip/tar.gz only) at https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
