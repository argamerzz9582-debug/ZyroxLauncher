name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_NEXT_KEYSTORE_PASSWORD }}
      MOJOPUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_NEXT_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_mojo/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS || secrets.GITHUB_TOKEN }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.3
          name: mesa-aar
          path: app_mojo/libs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Create out directory
        run: mkdir -p out

      - name: Build Publishing .aab
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_mojo:bundleFullGplay
          mv app_mojo/build/outputs/bundle/fullGplay/app_mojo-full-gplay.aab out/app-gplay.aab

      - name: Build ZyroxLauncher Full Debug APK
        run: |
          gradle :app_mojo:assembleFullDebug
          mv app_mojo/build/outputs/apk/full/debug/app_mojo-full-debug.apk out/ZyroxLauncher-full-debug.apk

      - name: Build ZyroxLauncher No-Runtime Debug APK
        run: |
          gradle :app_mojo:assembleNoruntimeDebug
          mv app_mojo/build/outputs/apk/noruntime/debug/app_mojo-noruntime-debug.apk out/ZyroxLauncher-noruntime-debug.apk

      - name: Build Nightly Release .apk
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_mojo:assembleFullPubRelease
          mv app_mojo/build/outputs/apk/full/pubRelease/app_mojo-full-pubRelease.apk out/ZyroxLauncher-release.apk

      - name: Generate checksums
        run: |
          md5sum out/ZyroxLauncher-full-debug.apk > out/ZyroxLauncher-full-debug.md5
          md5sum out/ZyroxLauncher-noruntime-debug.apk > out/ZyroxLauncher-noruntime-debug.md5
          sha256sum out/ZyroxLauncher-full-debug.apk > out/ZyroxLauncher-full-debug.sha256
          sha256sum out/ZyroxLauncher-noruntime-debug.apk > out/ZyroxLauncher-noruntime-debug.sha256

      - name: Upload ZyroxLauncher Full APK
        uses: actions/upload-artifact@v4
        with:
          name: ZyroxLauncher-full-debug
          path: out/ZyroxLauncher-full-debug.apk

      - name: Upload ZyroxLauncher No-Runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: ZyroxLauncher-noruntime-debug
          path: out/ZyroxLauncher-noruntime-debug.apk

      - name: Publish Zyrox Launcher Release APKs
        if: github.ref_name == 'v3_openjdk'
        uses: softprops/action-gh-release@v2
        with:
          name: Zyrox Launcher v1.0 (Latest Build)
          tag_name: v1.0.0-zyrox
          body: |
            ## Zyrox Launcher v1.0 — Landscape Dark Glass & Warm Amber Edition
            - **ZyroxLauncher-full-debug.apk** — Complete install-and-play APK with bundled OpenJDK runtime
            - **ZyroxLauncher-noruntime-debug.apk** — Compact APK (import your own `.tar.xz` JRE runtime)
            - Commit: `${{ github.sha }}`
          files: |
            out/ZyroxLauncher-full-debug.apk
            out/ZyroxLauncher-noruntime-debug.apk
            out/ZyroxLauncher-full-debug.sha256
            out/ZyroxLauncher-noruntime-debug.sha256

      - name: Upload AAB
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: git.artdeell.mjlaunch
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5
