name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a signed GitHub release (v3_openjdk only, requires ZYROX_KEYSTORE_* secrets)"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag to publish (e.g. v2.0.0)"
        required: false
        default: "v2.0.0"
        type: string

# Default least-privilege token across all jobs; only publish-release escalates to contents:write.
permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-sast:
    name: Security & Supply-Chain Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Security, Manifest & Supply-Chain Policy Audit (MobSF + Static Guardrails)
        run: |
          python3 -m pip install --quiet --upgrade pip mobsfscan
          mobsfscan app_mojo/src/main --json -o /tmp/mobsf-report.json || true
          python3 - <<'PY'
          import json, os, re, sys, xml.etree.ElementTree as ET

          failures = []

          # 1. MobSF static analysis assertions
          with open("/tmp/mobsf-report.json") as f:
              report = json.load(f)
          results = report.get("results", {})
          blocked_rules = {
              "android_zip_slip",
              "android_manifest_allow_backup",
              "android_manifest_base_config_cleartext",
              "android_manifest_domain_config_cleartext",
              "android_task_hijacking1",
              "android_task_hijacking2",
              "java_insecure_random",
          }
          for rule, info in results.items():
              sev = info.get("metadata", {}).get("severity", "")
              if sev == "ERROR" or rule in blocked_rules or rule.startswith("webview_"):
                  failures.append(f"MobSF [{sev}] {rule}: {len(info.get('files', []))} hit(s)")

          # 2. Zero committed signing keys or private material anywhere in repository
          for root, dirs, files in os.walk("."):
              if ".git" in dirs:
                  dirs.remove(".git")
              for fn in files:
                  if fn.endswith((".keystore", ".jks", ".p12", ".pfx", ".key")) or fn == "curseforge_key.txt":
                      failures.append(f"Committed secret/key file found: {os.path.join(root, fn)}")

          # 3. Workflow self-audit: never cache keystores/passwords or generate random release keys
          wf = open(".github/workflows/android.yml").read()
          for bad_wf, desc in (
              (".zyrox" + "-signing", "cached keystore directory"),
              ("zyrox-release" + ".pass", "cached plaintext keystore password"),
              ("-gen" + "keypair", "ephemeral CI keystore generation"),
          ):
              if bad_wf in wf:
                  failures.append(f"Workflow supply-chain violation ({desc}): {bad_wf}")

          # 4. AndroidManifest hardening & explicit exported declarations
          ns = "{http://schemas.android.com/apk/res/android}"
          manifest = ET.parse("app_mojo/src/main/AndroidManifest.xml").getroot()
          app = manifest.find("application")
          if app.get(ns + "allowBackup") != "false":
              failures.append("AndroidManifest application allowBackup must be false")
          if app.get(ns + "usesCleartextTraffic") != "false":
              failures.append("AndroidManifest application usesCleartextTraffic must be false")
          if app.get(ns + "debuggable") == "true":
              failures.append("AndroidManifest application must not set debuggable=true")
          for tag in ("activity", "service", "receiver", "provider"):
              for comp in app.findall(tag):
                  if comp.get(ns + "exported") is None:
                      failures.append(f"Missing explicit android:exported on <{tag} {comp.get(ns + 'name')}>")

          # 5. Network security config must forbid cleartext globally
          netcfg = open("app_mojo/src/main/res/xml/netconfig.xml").read()
          if 'cleartextTrafficPermitted="true"' in netcfg or 'cleartextTrafficPermitted="false"' not in netcfg:
              failures.append("netconfig.xml must enforce cleartextTrafficPermitted=\"false\"")

          # 6. Anti-PHA, credential-leak & UI regression guardrails
          banned = [
              ("obfuscated_hash", r"\bREQW_HASH\b"),
              ("deadlock_trap", r"\bwaitOnObj\b"),
              ("package_collision", r"git\.artdeell\.mjlaunch"),
              ("removed_updates_card", r"\bzyrox_updates_card\b"),
              ("stale_wiki_domain", r"mojolauncher\.ru"),
              ("raw_launchargs_log", r'Log\.[idwev]\(\s*"GameRunner"\s*,\s*"Running with "\s*\+\s*launchArgs\.toString\(\)'),
              ("token_log", r"Log\.[idwev]\([^;]*(authCode|Xbl Token|Xbl Xsts|MC token|access_token|refresh_token)"),
          ]
          for root, _, files in os.walk("app_mojo/src/main"):
              for fn in files:
                  if not fn.endswith((".java", ".xml", ".c", ".h")):
                      continue
                  path = os.path.join(root, fn)
                  content = open(path, errors="ignore").read()
                  for name, pattern in banned:
                      if re.search(pattern, content):
                          failures.append(f"Forbidden pattern [{name}] in {path}")

          if failures:
              for item in failures[:15]:
                  print(f"::error title=SecurityGateFailure::{item}")
              sys.exit(1)
          print("::notice title=SecurityGatePassed::MobSF SAST, manifest, netconfig, supply-chain & redaction checks passed (0 violations).")
          PY

  build-test-verify:
    name: Test, Lint & Unsigned Build
    needs: [security-sast]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # Strictly zero production signing credentials exposed to PR or branch verification builds.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Get LTW
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_mojo/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.3
          name: mesa-aar
          path: app_mojo/libs

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.5"

      - name: Run Automated JUnit Test Suite
        run: |
          set -o pipefail
          if ! gradle :app_mojo:testFullReleaseUnitTest --stacktrace 2>&1 | tee /tmp/gradle-test.log; then
            python3 - <<'PY'
          lines = open("/tmp/gradle-test.log", errors="ignore").read().splitlines()
          err = [l for l in lines if ("error:" in l or "FAILED" in l or "Exception" in l or "Caused by:" in l or "AssertionError" in l or "at git.artdeell" in l)]
          snippet = " || ".join((err[-30:] if err else lines[-30:]))[:3500]
          print(f"::error title=UnitTestFailure::{snippet}")
          PY
            exit 1
          fi
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failed = errors = 0
          suites = []
          for xf in sorted(glob.glob("app_mojo/build/test-results/testFullReleaseUnitTest/TEST-*.xml")):
              r = ET.parse(xf).getroot()
              t = int(r.get("tests", 0)); f = int(r.get("failures", 0)); e = int(r.get("errors", 0))
              total += t; failed += f; errors += e
              suites.append(f"{r.get('name').split('.')[-1]}({t})")
          print(f"::notice title=UnitTestsPassed::{total} tests passed, {failed} failures, {errors} errors across {', '.join(suites)}")
          PY

      - name: Run Android Lint Static Verification
        run: |
          set -o pipefail
          if ! gradle :app_mojo:lintFullRelease 2>&1 | tee /tmp/gradle-lint.log; then
            TAIL="$(grep -E 'error:|Error:|FAILED|Exception|Caused by:' /tmp/gradle-lint.log | tail -n 25 | tr '\n' ' ' | cut -c1-3200)"
            echo "::error title=LintFailure::${TAIL:-$(tail -n 20 /tmp/gradle-lint.log | tr '\n' ' ')}"
            exit 1
          fi
          echo "::notice title=AndroidLintPassed::lintFullRelease completed cleanly."

      - name: Build & Verify Unsigned Release APK
        run: |
          set -o pipefail
          mkdir -p out
          if ! gradle :app_mojo:assembleFullRelease 2>&1 | tee /tmp/gradle-apk.log; then
            TAIL="$(grep -E 'error:|FAILED|Exception|Caused by:' /tmp/gradle-apk.log | tail -n 30 | tr '\n' ' ' | cut -c1-3500)"
            echo "::error title=ApkBuildFailure::${TAIL:-$(tail -n 20 /tmp/gradle-apk.log | tr '\n' ' ')}"
            exit 1
          fi
          cp app_mojo/build/outputs/apk/full/release/app_mojo-full-release-unsigned.apk out/ZyroxLauncher-unsigned-release.apk
          python3 - <<'PY'
          import glob, hashlib, os, re, subprocess, sys

          def fail(msg):
              print(f"::error title=UnsignedVerifyFailure::{msg}")
              sys.exit(1)

          android_home = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT")
          def ver_key(p):
              return [int(x) if x.isdigit() else x for x in re.split(r"[.-]", os.path.basename(p))]
          bt = sorted(glob.glob(os.path.join(android_home, "build-tools", "*")), key=ver_key)[-1]
          aapt2 = os.path.join(bt, "aapt2")
          apk = "out/ZyroxLauncher-unsigned-release.apk"
          if not os.path.isfile(apk):
              fail(f"Missing unsigned APK: {apk}")
          size_mb = os.path.getsize(apk) / (1024 * 1024)
          badging_proc = subprocess.run([aapt2, "dump", "badging", apk], capture_output=True, text=True)
          if badging_proc.returncode != 0:
              fail(f"aapt2 dump badging failed: {badging_proc.stderr[:400]}")
          badging = badging_proc.stdout
          pkg_line = badging.splitlines()[0] if badging else "empty"
          for expected in ("package: name='com.zyrox.launcher'", "versionName='2.0.0'", "targetSdkVersion:'36'"):
              if expected not in badging:
                  fail(f"Missing {expected} in badging ({pkg_line})")
          if "application-debuggable" in badging:
              fail("APK has android:debuggable=true!")
          if "application-testOnly" in badging:
              fail("APK has android:testOnly=true!")
          h = hashlib.sha256()
          with open(apk, "rb") as fh:
              for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                  h.update(chunk)
          sha = h.hexdigest()
          print(f"::notice title=UnsignedApkVerified::pkg=com.zyrox.launcher ver=2.0.0 targetSdk=36 debuggable=false size={size_mb:.1f}MB sha256={sha}")
          PY

      - name: Upload Unsigned Release CI Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ZyroxLauncher-unsigned-ci-apk
          path: out/ZyroxLauncher-unsigned-release.apk
          retention-days: 14

  sign-release:
    name: Trusted Production Signing & Verification
    needs: [build-test-verify]
    # Restricted strictly to non-PR runs on the protected default branch or official v* release tags.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/v3_openjdk' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.check_secrets.outputs.signed }}
    steps:
      - name: Check Production Signing Secrets Availability
        id: check_secrets
        env:
          SECRET_KS_B64: ${{ secrets.ZYROX_KEYSTORE_BASE64 }}
          SECRET_KS_PASS: ${{ secrets.ZYROX_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ZYROX_KEY_ALIAS }}
        run: |
          if [ -n "$SECRET_KS_B64" ] && [ -n "$SECRET_KS_PASS" ] && [ -n "$SECRET_KEY_ALIAS" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=SigningSkippedNoSecrets::Production signing skipped safely because ZYROX_KEYSTORE_BASE64 / ZYROX_KEYSTORE_PASSWORD / ZYROX_KEY_ALIAS repository secrets are not configured. No keystore is ever cached or auto-generated."
          fi

      - name: Checkout
        if: steps.check_secrets.outputs.signed == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Get LTW
        if: steps.check_secrets.outputs.signed == 'true'
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_mojo/libs

      - name: Get Mesa
        if: steps.check_secrets.outputs.signed == 'true'
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS || secrets.GITHUB_TOKEN }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.3
          name: mesa-aar
          path: app_mojo/libs

      - name: Set up JDK 17
        if: steps.check_secrets.outputs.signed == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        if: steps.check_secrets.outputs.signed == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.5"

      - name: Build Signed Release APK & Play Bundle (Ephemeral Secret Keystore Only)
        if: steps.check_secrets.outputs.signed == 'true'
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          SECRET_KS_B64: ${{ secrets.ZYROX_KEYSTORE_BASE64 }}
          ZYROX_KEYSTORE_PASSWORD: ${{ secrets.ZYROX_KEYSTORE_PASSWORD }}
          ZYROX_KEY_ALIAS: ${{ secrets.ZYROX_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.ZYROX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p out
          KS_FILE="$RUNNER_TEMP/zyrox-release-ephemeral.keystore"
          printf '%s' "$SECRET_KS_B64" | tr -d ' \n\r\t' | base64 -d > "$KS_FILE"
          chmod 600 "$KS_FILE"
          export ZYROX_KEYSTORE_PATH="$KS_FILE"
          export ZYROX_KEY_PASSWORD="${SECRET_KEY_PASS:-$ZYROX_KEYSTORE_PASSWORD}"
          gradle :app_mojo:assembleFullRelease :app_mojo:bundleFullRelease
          cp app_mojo/build/outputs/apk/full/release/app_mojo-full-release.apk out/Zyrox.Launcher.apk
          cp app_mojo/build/outputs/bundle/fullRelease/app_mojo-full-release.aab out/ZyroxLauncher-full-release.aab

      - name: Purge Ephemeral Signing Keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/zyrox-release-ephemeral.keystore"

      - name: Verify zipalign, APK Signature v1/v2/v3, Certificate Fingerprint & SHA-256
        if: steps.check_secrets.outputs.signed == 'true'
        run: |
          python3 - <<'PY'
          import glob, hashlib, os, re, subprocess, sys

          def fail(msg):
              print(f"::error title=ReleaseSignatureFailure::{msg}")
              sys.exit(1)

          android_home = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT")
          def ver_key(p):
              return [int(x) if x.isdigit() else x for x in re.split(r"[.-]", os.path.basename(p))]
          bt = sorted(glob.glob(os.path.join(android_home, "build-tools", "*")), key=ver_key)[-1]
          zipalign = os.path.join(bt, "zipalign")
          apksigner = os.path.join(bt, "apksigner")
          aapt2 = os.path.join(bt, "aapt2")

          apk = "out/Zyrox.Launcher.apk"
          aab = "out/ZyroxLauncher-full-release.aab"
          if subprocess.run([zipalign, "-c", "4", apk], capture_output=True).returncode != 0:
              fail("zipalign verification failed")

          sig = subprocess.run([apksigner, "verify", "--verbose", "--print-certs", apk], capture_output=True, text=True)
          if sig.returncode != 0:
              fail(f"apksigner verification failed: {sig.stdout} {sig.stderr}")
          s_out = sig.stdout
          for req in (
              "Verified using v1 scheme (JAR signing): true",
              "Verified using v2 scheme (APK Signature Scheme v2): true",
              "Verified using v3 scheme (APK Signature Scheme v3): true",
          ):
              if req not in s_out:
                  fail(f"Missing required signature scheme: {req}")
          if "android debug" in s_out.lower():
              fail("Refusing Android Debug certificate for release artifact")

          cert_sha256 = ""
          cert_dn = ""
          for line in s_out.splitlines():
              low = line.lower()
              if "certificate dn:" in low and not cert_dn:
                  cert_dn = line.split(":", 1)[1].strip()
              elif "certificate sha-256 digest:" in low and not cert_sha256:
                  cert_sha256 = line.split(":", 1)[1].strip()

          badging = subprocess.run([aapt2, "dump", "badging", apk], capture_output=True, text=True, check=True).stdout
          for expected in ("package: name='com.zyrox.launcher'", "versionName='2.0.0'", "targetSdkVersion:'36'"):
              if expected not in badging:
                  fail(f"Missing {expected} in signed APK badging")
          if "application-debuggable" in badging or "application-testOnly" in badging:
              fail("Signed APK must not be debuggable or testOnly")

          jv = subprocess.run(["jarsigner", "-verify", aab], capture_output=True, text=True)
          if jv.returncode != 0 or "jar verified." not in jv.stdout:
              fail("AAB jarsigner verification failed")

          def sha256_file(path):
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          apk_sha = sha256_file(apk)
          aab_sha = sha256_file(aab)
          with open("out/SHA256SUMS.txt", "w") as sf:
              sf.write(f"{apk_sha}  Zyrox.Launcher.apk\n")
              sf.write(f"{aab_sha}  ZyroxLauncher-full-release.aab\n")
          with open("out/SIGNING_CERTIFICATE_SHA256.txt", "w") as cf:
              cf.write(f"Package: com.zyrox.launcher\n")
              cf.write(f"Version: 2.0.0\n")
              cf.write(f"Signature Schemes: v1 + v2 + v3\n")
              cf.write(f"Certificate DN: {cert_dn}\n")
              cf.write(f"Certificate SHA-256: {cert_sha256}\n")
              cf.write(f"APK SHA-256: {apk_sha}\n")

          size_mb = os.path.getsize(apk) / (1024 * 1024)
          print(f"::notice title=SignedReleaseVerified::pkg=com.zyrox.launcher ver=2.0.0 sig=v1+v2+v3 size={size_mb:.1f}MB sha256={apk_sha} cert_sha256={cert_sha256}")
          PY

      - name: Upload Verified Signed Release Bundle
        if: steps.check_secrets.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ZyroxLauncher-signed-release
          path: |
            out/Zyrox.Launcher.apk
            out/ZyroxLauncher-full-release.aab
            out/SHA256SUMS.txt
            out/SIGNING_CERTIFICATE_SHA256.txt
          retention-days: 30

  publish-release:
    name: Publish Authorized GitHub Release
    needs: [sign-release]
    # Only publishes when explicitly triggered by a v* release tag or manual publish_release=true dispatch.
    if: >-
      needs.sign-release.outputs.signed == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/v3_openjdk' &&
        inputs.publish_release == true))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download Verified Signed Release Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ZyroxLauncher-signed-release
          path: out

      - name: Publish Signed GitHub Release with SHA-256 & Certificate Metadata
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${INPUT_TAG:-v2.0.0}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error title=InvalidReleaseTag::Refusing invalid tag format: $TAG"
            exit 1
          fi
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            echo "## Zyrox Launcher ${TAG}"
            echo ""
            echo "### Artifact Verification"
            echo '```'
            cat out/SIGNING_CERTIFICATE_SHA256.txt
            echo '```'
            echo ""
            echo "Verify your downloaded APK locally with \`sha256sum\` and \`apksigner verify --print-certs\` against \`SHA256SUMS.txt\` and \`SIGNING_CERTIFICATE_SHA256.txt\`."
          } > "$NOTES_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "out/Zyrox.Launcher.apk#Zyrox Launcher.apk" \
              "out/SHA256SUMS.txt" \
              "out/SIGNING_CERTIFICATE_SHA256.txt" \
              --clobber
          else
            gh release create "$TAG" \
              "out/Zyrox.Launcher.apk#Zyrox Launcher.apk" \
              "out/SHA256SUMS.txt" \
              "out/SIGNING_CERTIFICATE_SHA256.txt" \
              --target "$GITHUB_SHA" \
              --title "Zyrox Launcher ${TAG}" \
              --notes-file "$NOTES_FILE"
          fi
