name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      ZYROX_SECRET_KS_PRESENT: ${{ secrets.ZYROX_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
      ZYROX_PLAY_SA_PRESENT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Security & Play Protect SAST Gate (MobSF + Policy Audit)
        run: |
          python3 -m pip install --quiet --upgrade pip mobsfscan
          mobsfscan app_mojo/src/main --json -o /tmp/mobsf-report.json || true
          python3 - <<'PY'
          import json, os, re, sys, xml.etree.ElementTree as ET

          failures = []

          # 1. MobSF static analysis assertions
          with open("/tmp/mobsf-report.json") as f:
              report = json.load(f)
          results = report.get("results", {})
          blocked_rules = {
              "android_zip_slip",
              "android_manifest_allow_backup",
              "android_manifest_base_config_cleartext",
              "android_manifest_domain_config_cleartext",
              "android_task_hijacking1",
              "android_task_hijacking2",
              "java_insecure_random",
          }
          for rule, info in results.items():
              sev = info.get("metadata", {}).get("severity", "")
              if sev == "ERROR" or rule in blocked_rules or rule.startswith("webview_"):
                  failures.append(f"MobSF [{sev}] {rule}: {len(info.get('files', []))} hit(s)")

          # 2. Zero committed signing keys anywhere in repository
          for root, dirs, files in os.walk("."):
              if ".git" in dirs:
                  dirs.remove(".git")
              for fn in files:
                  if fn.endswith((".keystore", ".jks", ".p12", ".pfx", ".key")):
                      failures.append(f"Committed keystore/key file found: {os.path.join(root, fn)}")

          # 3. AndroidManifest hardening & explicit exported declarations
          ns = "{http://schemas.android.com/apk/res/android}"
          manifest = ET.parse("app_mojo/src/main/AndroidManifest.xml").getroot()
          app = manifest.find("application")
          if app.get(ns + "allowBackup") != "false":
              failures.append("AndroidManifest application allowBackup must be false")
          if app.get(ns + "usesCleartextTraffic") != "false":
              failures.append("AndroidManifest application usesCleartextTraffic must be false")
          if app.get(ns + "debuggable") == "true":
              failures.append("AndroidManifest application must not set debuggable=true")
          for tag in ("activity", "service", "receiver", "provider"):
              for comp in app.findall(tag):
                  if comp.get(ns + "exported") is None:
                      failures.append(f"Missing explicit android:exported on <{tag} {comp.get(ns + 'name')}>")

          # 4. Network security config must forbid cleartext globally
          netcfg = open("app_mojo/src/main/res/xml/netconfig.xml").read()
          if 'cleartextTrafficPermitted="true"' in netcfg or 'cleartextTrafficPermitted="false"' not in netcfg:
              failures.append("netconfig.xml must enforce cleartextTrafficPermitted=\"false\"")

          # 5. Play Protect anti-PHA, credential-leak & UI regression guardrails
          banned = [
              ("obfuscated_hash", r"\bREQW_HASH\b"),
              ("deadlock_trap", r"\bwaitOnObj\b"),
              ("package_collision", r"git\.artdeell\.mjlaunch"),
              ("removed_updates_card", r"\bzyrox_updates_card\b"),
              ("token_log", r"Log\.[idwev]\([^;]*(authCode|Xbl Token|Xbl Xsts|MC token|access_token|refresh_token)"),
          ]
          for root, _, files in os.walk("app_mojo/src/main"):
              for fn in files:
                  if not fn.endswith((".java", ".xml", ".c", ".h")):
                      continue
                  path = os.path.join(root, fn)
                  content = open(path, errors="ignore").read()
                  for name, pattern in banned:
                      if re.search(pattern, content):
                          failures.append(f"Forbidden pattern [{name}] in {path}")

          if failures:
              print("SECURITY GATE FAILED:")
              for item in failures:
                  print("  -", item)
              sys.exit(1)
          print("Security & Play Protect SAST Gate PASSED (0 errors, 0 policy violations).")
          PY

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_mojo/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS || secrets.GITHUB_TOKEN }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.3
          name: mesa-aar
          path: app_mojo/libs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore managed release signing store
        if: env.ZYROX_SECRET_KS_PRESENT != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.zyrox-signing
          key: zyrox-release-signing-rsa4096-v1

      - name: Configure Production Release Signing (RSA-4096 v1/v2/v3)
        env:
          SECRET_KS_B64: ${{ secrets.ZYROX_KEYSTORE_BASE64 }}
          SECRET_KS_PASS: ${{ secrets.ZYROX_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ZYROX_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.ZYROX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SIGN_DIR="$HOME/.zyrox-signing"
          mkdir -p "$SIGN_DIR"
          chmod 700 "$SIGN_DIR"

          if [ -n "$SECRET_KS_B64" ] && [ -n "$SECRET_KS_PASS" ] && [ -n "$SECRET_KEY_ALIAS" ]; then
            echo "Using repository secret ZYROX_KEYSTORE_BASE64 for release signing."
            KS_FILE="$RUNNER_TEMP/zyrox-owner-release.keystore"
            printf '%s' "$SECRET_KS_B64" | tr -d ' \n\r\t' | base64 -d > "$KS_FILE"
            chmod 600 "$KS_FILE"
            KEY_PASS="${SECRET_KEY_PASS:-$SECRET_KS_PASS}"
            echo "ZYROX_KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "ZYROX_KEYSTORE_PASSWORD=$SECRET_KS_PASS" >> "$GITHUB_ENV"
            echo "ZYROX_KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ZYROX_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            KS_FILE="$SIGN_DIR/zyrox-release.p12"
            PASS_FILE="$SIGN_DIR/zyrox-release.pass"
            ALIAS="zyrox_release"
            if [ ! -f "$KS_FILE" ] || [ ! -f "$PASS_FILE" ]; then
              echo "Generating persistent RSA-4096 SHA256withRSA PKCS12 release keystore..."
              GEN_PASS="$(openssl rand -hex 32)"
              echo "::add-mask::$GEN_PASS"
              printf '%s' "$GEN_PASS" > "$PASS_FILE"
              chmod 600 "$PASS_FILE"
              keytool -genkeypair -noprompt \
                -storetype PKCS12 \
                -keystore "$KS_FILE" \
                -storepass "$GEN_PASS" \
                -keypass "$GEN_PASS" \
                -alias "$ALIAS" \
                -keyalg RSA \
                -keysize 4096 \
                -sigalg SHA256withRSA \
                -validity 10000 \
                -dname "CN=Zyrox Launcher, OU=Android Engineering, O=Zyrox Studios, L=New Delhi, ST=Delhi, C=IN"
              chmod 600 "$KS_FILE"
            fi
            MANAGED_PASS="$(cat "$PASS_FILE")"
            echo "::add-mask::$MANAGED_PASS"
            echo "ZYROX_KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "ZYROX_KEYSTORE_PASSWORD=$MANAGED_PASS" >> "$GITHUB_ENV"
            echo "ZYROX_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
            echo "ZYROX_KEY_PASSWORD=$MANAGED_PASS" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Create out directory
        run: mkdir -p out

      - name: Run Automated Metadata, Loader & Cache Unit Tests
        run: |
          set -o pipefail
          if ! gradle :app_mojo:testFullReleaseUnitTest --stacktrace 2>&1 | tee /tmp/gradle-test.log; then
            python3 - <<'PY'
          lines = open("/tmp/gradle-test.log", errors="ignore").read().splitlines()
          err = [l for l in lines if ("error:" in l or "FAILED" in l or "Exception" in l or "Caused by:" in l or "AssertionError" in l or "at git.artdeell" in l)]
          snippet = " || ".join((err[-25:] if err else lines[-25:]))[:3500]
          print(f"::error title=UnitTestFailure::{snippet}")
          PY
            exit 1
          fi
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failed = errors = 0
          suites = []
          for xf in sorted(glob.glob("app_mojo/build/test-results/testFullReleaseUnitTest/TEST-*.xml")):
              r = ET.parse(xf).getroot()
              t = int(r.get("tests", 0)); f = int(r.get("failures", 0)); e = int(r.get("errors", 0))
              total += t; failed += f; errors += e
              suites.append(f"{r.get('name').split('.')[-1]}({t})")
          print(f"::notice title=UnitTestsPassed::{total} tests passed, {failed} failures, {errors} errors across {', '.join(suites)}")
          PY

      - name: Run Android Lint Static Verification
        run: |
          set -o pipefail
          if ! gradle :app_mojo:lintFullRelease 2>&1 | tee /tmp/gradle-lint.log; then
            TAIL="$(tail -n 25 /tmp/gradle-lint.log | tr '\n' ' ' | cut -c1-3000)"
            echo "::error title=LintFailure::$TAIL"
            exit 1
          fi

      - name: Build Signed Release APK (Zyrox Launcher.apk)
        run: |
          set -o pipefail
          if ! gradle :app_mojo:assembleFullRelease 2>&1 | tee /tmp/gradle-apk.log; then
            TAIL="$(grep -E 'error:|FAILED|Exception|Caused by:' /tmp/gradle-apk.log | tail -n 25 | tr '\n' ' ' | cut -c1-3000)"
            echo "::error title=ApkBuildFailure::${TAIL:-$(tail -n 20 /tmp/gradle-apk.log | tr '\n' ' ')}"
            exit 1
          fi
          cp app_mojo/build/outputs/apk/full/release/app_mojo-full-release.apk out/Zyrox.Launcher.apk

      - name: Build Play Store Release Bundle (.aab)
        run: |
          gradle :app_mojo:bundleFullRelease
          mv app_mojo/build/outputs/bundle/fullRelease/app_mojo-full-release.aab out/ZyroxLauncher-full-release.aab

      - name: Verify APK Alignment, v1/v2/v3 Release Signatures & Play Protect Compliance
        run: |
          python3 - <<'PY'
          import glob, hashlib, os, re, subprocess, sys

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          android_home = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT")
          if not android_home:
              fail("ANDROID_HOME is not set")

          def ver_key(p):
              return [int(x) if x.isdigit() else x for x in re.split(r"[.-]", os.path.basename(p))]

          bt_dirs = sorted(glob.glob(os.path.join(android_home, "build-tools", "*")), key=ver_key)
          if not bt_dirs:
              fail("No Android build-tools found")
          bt = bt_dirs[-1]
          zipalign = os.path.join(bt, "zipalign")
          apksigner = os.path.join(bt, "apksigner")
          aapt2 = os.path.join(bt, "aapt2")
          print(f"Using Android build-tools: {bt}")

          apk = "out/Zyrox.Launcher.apk"
          if not os.path.isfile(apk):
              fail(f"Missing built APK: {apk}")
          size_mb = os.path.getsize(apk) / (1024 * 1024)

          # 1. Verify 4-byte zipalign
          za = subprocess.run([zipalign, "-c", "4", apk], capture_output=True, text=True)
          if za.returncode != 0:
              fail(f"zipalign check failed: {za.stdout} {za.stderr}")

          # 2. Verify APK Signature Scheme v1 + v2 + v3 and production RSA-4096 cert
          sig = subprocess.run(
              [apksigner, "verify", "--verbose", "--print-certs", apk],
              capture_output=True, text=True
          )
          if sig.returncode != 0:
              fail(f"apksigner verify failed: {sig.stdout} {sig.stderr}")
          s_out = sig.stdout
          for req in (
              "Verified using v1 scheme (JAR signing): true",
              "Verified using v2 scheme (APK Signature Scheme v2): true",
              "Verified using v3 scheme (APK Signature Scheme v3): true",
          ):
              if req not in s_out:
                  first_lines = " | ".join(s_out.splitlines()[:10])
                  fail(f"APK missing '{req}' (got: {first_lines})")
          if "android debug" in s_out.lower():
              fail("APK is signed with an Android Debug certificate!")

          cert_dn = ""
          cert_sha256 = ""
          cert_key = ""
          for line in s_out.splitlines():
              low = line.lower()
              if "certificate dn:" in low and not cert_dn:
                  cert_dn = line.split(":", 1)[1].strip()
              elif "certificate sha-256 digest:" in low and not cert_sha256:
                  cert_sha256 = line.split(":", 1)[1].strip()
              elif ("key algorithm:" in low or "certificate key:" in low) and not cert_key:
                  cert_key = line.strip()

          # 3. Verify compiled manifest badging: package ID, versionName 1.0.3, targetSdk 36, non-debuggable, non-testOnly
          badging_proc = subprocess.run([aapt2, "dump", "badging", apk], capture_output=True, text=True)
          if badging_proc.returncode != 0:
              fail(f"aapt2 dump badging failed: {badging_proc.stderr[:300]}")
          badging = badging_proc.stdout
          pkg_line = badging.splitlines()[0] if badging else "empty"
          if "package: name='com.zyrox.launcher'" not in badging:
              fail(f"Unexpected package line: {pkg_line}")
          if "versionName='1.0.3'" not in badging:
              fail(f"Expected versionName='1.0.3', got: {pkg_line}")
          if "targetSdkVersion:'36'" not in badging:
              fail("APK does not declare targetSdkVersion 36")
          if "application-debuggable" in badging:
              fail("APK has android:debuggable=true!")
          if "application-testOnly" in badging:
              fail("APK has android:testOnly=true!")

          # 4. Compute APK SHA-256 for build summary (never uploaded as a release asset)
          h = hashlib.sha256()
          with open(apk, "rb") as fh:
              for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                  h.update(chunk)
          apk_sha = h.hexdigest()

          # 5. Verify Play Store .aab signature
          aab = "out/ZyroxLauncher-full-release.aab"
          if not os.path.isfile(aab):
              fail("Missing built Play Store AAB")
          jv = subprocess.run(["jarsigner", "-verify", aab], capture_output=True, text=True)
          if jv.returncode != 0 or "jar verified." not in jv.stdout:
              fail(f"jarsigner verification failed for AAB: {jv.stdout} {jv.stderr}")

          cert_report_lines = [
              f"Release Asset: Zyrox Launcher.apk (Zyrox.Launcher.apk, {size_mb:.1f} MB)",
              f"Package Line: {pkg_line}",
              f"APK SHA-256: {apk_sha}",
              f"Compliance: targetSdk=36 | debuggable=false | testOnly=false | zipalign=OK | sig=v1+v2+v3",
              f"Certificate DN: {cert_dn}",
              f"Certificate SHA-256: {cert_sha256}",
              *( [cert_key] if cert_key else [] ),
          ]
          print(
              f"::notice title=Verified Zyrox Launcher.apk::pkg=com.zyrox.launcher ver=1.0.3 targetSdk=36 "
              f"zipalign=OK sig=v1+v2+v3 size={size_mb:.1f}MB sha256={apk_sha} cert_sha256={cert_sha256}"
          )

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as sm:
                  sm.write("## Zyrox Launcher v1.0.3 Release Verification\n\n")
                  sm.write("```\n" + "\n".join(cert_report_lines) + "\n```\n")
          PY

      - name: Upload Zyrox Launcher Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Zyrox-Launcher-apk
          path: out/Zyrox.Launcher.apk

      - name: Upload ZyroxLauncher Play Store Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: ZyroxLauncher-full-release-aab
          path: out/ZyroxLauncher-full-release.aab

      - name: Publish Signed Zyrox Launcher v1.0.3 GitHub Release (Single APK Asset)
        if: github.ref_name == 'v3_openjdk'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v1.0.3"
          TITLE="Zyrox Launcher v1.0.3"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES_FILE" <<EOF
          ## Zyrox Launcher v1.0.3

          ### Highlights
          - **Cleaner Home Screen**: Removed the home screen Updates card for a streamlined landscape experience while preserving all account, instance, navigation, and launch controls.
          - **Animated Minecraft Sunset Loading Backdrop**: Added a lightweight hardware-accelerated blocky Minecraft mountain, pine ridge, cloud, and golden-sunset loading scene strictly behind touch controls with real launch-stage status, background pause/resume, and smooth transition into the game window.
          - **Automatic Official Minecraft Version Discovery**: Dynamic syncing against official Mojang \`version_manifest_v2.json\` across releases, snapshots, old beta/alpha, and year-based \`26.x+\` versions, with atomic local caching, \`ETag\`/\`Last-Modified\` conditional refresh, live version selector refresh, full offline fallback, dynamic Java 8/17/21/25+ runtime detection, and forward-compatible LWJGL Android handling.
          - **Official Mod Loader Discovery & Compatibility**: Unified official metadata integration for **Fabric**, **Legacy Fabric**, **Quilt**, **Forge** (with recommended promotions & XXE-safe Maven parsing), and **NeoForge** (\`1.20.x\`–\`1.21.x\` and year-based \`26.x+\` + snapshots) with exact version compatibility checks and profile verification.
          - **Hardened Modrinth & CurseForge Integration**: Official API rate-limit/retry handling, primary artifact selection, client-side \`.mrpack\` environment filtering, CurseForge \`edge.forgecdn.net\` fallback, and strict Forge/NeoForge/Fabric/Quilt manifest compatibility verification.

          ### Installation
          Download and install **[Zyrox Launcher.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.3/Zyrox.Launcher.apk)** directly (signed with the persistent RSA-4096 \`v1 + v2 + v3\` publisher certificate for seamless in-place upgrade over earlier releases).
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Remove any previously uploaded assets so strictly ONE APK asset exists alongside source archives
            for ASSET in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$TAG" "$ASSET" --yes
            done
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" --latest
            gh release upload "$TAG" "out/Zyrox.Launcher.apk#Zyrox Launcher.apk" --clobber
          else
            gh release create "$TAG" "out/Zyrox.Launcher.apk#Zyrox Launcher.apk" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi

      - name: Upload to Google Play Console (Internal Track)
        if: github.ref_name == 'v3_openjdk' && env.ZYROX_PLAY_SA_PRESENT == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.zyrox.launcher
          releaseFiles: out/ZyroxLauncher-full-release.aab
          track: internal
          inAppUpdatePriority: 5
