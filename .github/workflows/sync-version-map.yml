name: Sync version map

# Maintainers update version_map.json manually. This workflow syncs it to
# FCL-Repo/res/version_map.json, the Gitee mirror used by mainland China users.
on:
  push:
    branches:
      - main
    paths:
      - "version_map.json"
  workflow_dispatch:

# Keep only the latest run to avoid concurrent pushes racing and causing
# non-fast-forward errors in FCL-Repo.
concurrency:
  group: sync-version-map
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FoldCraftLauncher
        uses: actions/checkout@v4

      - name: Checkout FCL-Repo
        uses: actions/checkout@v4
        with:
          repository: FCL-Team/FCL-Repo
          ref: main
          # TOKEN must have write access to FCL-Team/FCL-Repo.
          token: ${{ secrets.TOKEN }}
          path: fcl-repo

      # Validate the manually maintained JSON before syncing it to the mirror.
      - name: Validate JSON
        run: python3 -m json.tool version_map.json > /dev/null

      - name: Sync res/version_map.json
        working-directory: fcl-repo
        run: |
          cp "$GITHUB_WORKSPACE/version_map.json" res/version_map.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "res/version_map.json unchanged"
          else
            git add res/version_map.json
            git commit -m "Update version_map.json"
            git push
          fi
