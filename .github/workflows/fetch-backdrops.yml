name: Build Minecraft backdrops (temporary)

# Temporary helper for the backdrop refresh: the agent sandbox has no access to YouTube/Pixabay,
# so the runner downloads + encodes the licensed clips and commits the result to this branch.
# Removed again before the PR is merged.
on:
  push:
    branches: [arena/2f066b6a-zyroxlauncher]
    paths:
      - ".github/workflows/fetch-backdrops.yml"
      - "tools/backdrops/plan.tsv"
      - "tools/backdrops/mode"
      - "tools/backdrops/keys"

permissions:
  contents: write

concurrency:
  group: backdrops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backdrops:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          python3 -m pip install --quiet --upgrade "yt-dlp[default]"
          curl -fsSL https://deno.land/install.sh | sh -s -- -y > /dev/null 2>&1 || true
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          yt-dlp --version
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -E "libx264|libwebp" || true
      - name: Run pipeline
        run: |
          MODE="$(cat tools/backdrops/mode 2>/dev/null || echo preview)"
          export KEYS="$(cat tools/backdrops/keys 2>/dev/null || echo spirit shaders diamond snow)"
          bash tools/backdrops/build_backdrops.sh "$MODE"
      - name: Commit results
        run: |
          git config user.name "zyrox-backdrop-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools/backdrops/preview app_mojo/src/main/res/raw app_mojo/src/main/res/drawable-nodpi || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore(backdrops): runner output ($(cat tools/backdrops/mode 2>/dev/null || echo preview))"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
