name: Feature Request
description: Propose a new feature for Fold Craft Launcher.
labels: enhancement
body:
  - type: markdown
    attributes:
      value: |
        Check the issue list for duplicates before submitting.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I understand this is a feature request, not a general support question.
          required: true
        - label: I have searched existing issues.
          required: true
  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      description: Describe the feature you would like to add.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Motivation
      description: Explain the benefits of this feature and why it would be useful.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution (Optional)
      description: If you have an idea for how to implement this feature, describe it here.
