name: Bug Report
description: Report a bug in Fold Craft Launcher.
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, make sure you are using the latest version, including beta versions. Check for updates on the launcher's Settings page.
        Please make sure your issue is not related to a modpack. Modpack support requests may be closed.
        For community support, visit the Community page in the launcher.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have read the information above.
          required: true
        - label: My issue is not about a modpack.
          required: true
        - label: I have searched existing issues.
          required: true
        - label: I have tried switching renderers.
        - label: I have attached launcher logs or crash reports, if available.
  - type: dropdown
    id: category
    attributes:
      label: Problem Type
      description: What kind of problem did you encounter?
      options:
        - Launcher crash
        - Game fails to launch
        - In-game crash
        - Rendering issue
        - Download issue
        - Account or login issue
        - Multiplayer issue
        - Control or input issue
        - UI display issue
        - Other
    validations:
      required: true
  - type: input
    id: fcl-version
    attributes:
      label: Launcher Version
      description: Enter the Fold Craft Launcher version shown on the About page.
      placeholder: e.g. 1.3.3.5
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device Information
      description: Include your device model, Android version, and CPU architecture.
      placeholder: e.g. Redmi K60, Android 14, arm64-v8a
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java Version
      description: Enter the Java runtime used by the game. The launcher includes Java 8, 17, 21, and 25, and supports custom runtimes.
      placeholder: e.g. Java 21 (bundled)
  - type: input
    id: renderer
    attributes:
      label: Renderer
      description: Enter the renderer you are using, including any renderer plugin. Different renderers support different game versions (for example, Holy-GL4ES supports up to 1.21.4, while VGPU supports up to 1.16.5).
      placeholder: e.g. Holy-GL4ES, Zink, VirGLRenderer, Freedreno, or Krypton Wrapper
  - type: input
    id: game-version
    attributes:
      label: Game Version
      description: If the issue is with a game version downloaded through Fold Craft Launcher, enter that version here.
      placeholder: e.g. 1.20.1, 1.21.4, or 26.2
  - type: input
    id: game-modify
    attributes:
      label: Game Modifications
      description: List OptiFine, Forge, NeoForge, Fabric, or other mods installed for the game.
      placeholder: e.g. OptiFine HD_U_G9, Forge
  - type: textarea
    id: bug-report
    attributes:
      label: Problem Description
      description: Describe the problem in as much detail as possible, including the steps that led to it.
    validations:
      required: true
  - type: textarea
    id: game-crash-report
    attributes:
      label: Game Crash Report
      description: If available, paste the crash report or game log. Logs are stored in FCL/log/latest_game.log. You can also use Share Log or Upload Log on the crash page.
  - type: textarea
    id: fcl-crash-report
    attributes:
      label: Launcher Crash Report
      description: Upload the launcher crash report, if available.
  - type: textarea
    id: fcl-logs
    attributes:
      label: Launcher Log File
      description: After the issue occurs, choose Export launcher logs on the launcher's Settings page and attach the exported file. Logs are essential for troubleshooting.
